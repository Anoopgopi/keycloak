# Keycloak Site 2 Configuration
# Uses Redis on port 6380 as local cache, replicates to site1 on port 6379

# Database configuration (use H2 for testing - separate DB)
db=dev-file
db-url=jdbc:h2:file:~/keycloak-site2-db;AUTO_SERVER=TRUE

# HTTP configuration (different port for site2)
http-enabled=true
http-port=8180
hostname-strict=false

# Disable HTTPS for local testing
https-port=8543
hostname-strict-https=false

# Redis connection for local cache (uses port 6380)
spi-connections-redis-default-host=localhost
spi-connections-redis-default-port=6380
spi-connections-redis-default-database=0

# Enable Redis user cache provider
spi-user-cache-provider=redis

# Cross-DC configuration for active-active setup
spi-user-cache-redis-cross-dc-enabled=true
spi-user-cache-redis-cross-dc-site-name=site2
spi-user-cache-redis-cross-dc-remote-sites=site1:localhost:6379
spi-user-cache-redis-cross-dc-replication-mode=ASYNC_WITH_RETRY
spi-user-cache-redis-cross-dc-circuit-breaker-threshold=5
spi-user-cache-redis-cross-dc-circuit-breaker-reset=30000

# Logging
log-level=INFO,org.keycloak.models.cache.redis:DEBUG,org.keycloak.connections.redis:DEBUG

# Health check
health-enabled=true
metrics-enabled=true
