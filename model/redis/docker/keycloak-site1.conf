# Keycloak Site 1 Configuration
# Uses Redis on port 6379 as local cache, replicates to site2 on port 6380

# Database configuration (use H2 for testing)
db=dev-file
db-url=jdbc:h2:file:~/keycloak-site1-db;AUTO_SERVER=TRUE

# HTTP configuration
http-enabled=true
http-port=8080
hostname-strict=false

# Disable HTTPS for local testing
https-port=8443
hostname-strict-https=false

# Redis connection for local cache
spi-connections-redis-default-host=localhost
spi-connections-redis-default-port=6379
spi-connections-redis-default-database=0

# Enable Redis user cache provider
spi-user-cache-provider=redis

# Cross-DC configuration for active-active setup
spi-user-cache-redis-cross-dc-enabled=true
spi-user-cache-redis-cross-dc-site-name=site1
spi-user-cache-redis-cross-dc-remote-sites=site2:localhost:6380
spi-user-cache-redis-cross-dc-replication-mode=ASYNC_WITH_RETRY
spi-user-cache-redis-cross-dc-circuit-breaker-threshold=5
spi-user-cache-redis-cross-dc-circuit-breaker-reset=30000

# Logging
log-level=INFO,org.keycloak.models.cache.redis:DEBUG,org.keycloak.connections.redis:DEBUG

# Health check
health-enabled=true
metrics-enabled=true
